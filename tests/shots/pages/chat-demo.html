<!doctype html>
<!--
  Нейтральная страница «чата с ассистентом» для снимков магазинов и README (версия 0.5, WP12-F, К15/К16).
  Локальная: отдаётся через context.route под вымышленным origin, внешней сети нет. Без логотипов и названий
  настоящих ИИ-сервисов. Язык — ?lang=ru|en. Принятые сайтом файлы — в window.__files (для снимка «до и после»).
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Ассистент</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font:
          15px/1.5 'Noto Sans',
          'DejaVu Sans',
          system-ui,
          sans-serif;
        color: #1f2430;
        background: #fff;
      }
      aside {
        width: 248px;
        background: #f4f5f8;
        border-right: 1px solid #e3e5ec;
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .new {
        border: 1px solid #d5d8e2;
        background: #fff;
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .hist-h {
        font-size: 12px;
        color: #7a8091;
        margin: 6px 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .hist {
        padding: 8px 10px;
        border-radius: 8px;
        color: #39404f;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hist.on {
        background: #e6e9f2;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      header {
        height: 56px;
        border-bottom: 1px solid #eceef3;
        display: flex;
        align-items: center;
        padding: 0 24px;
        font-weight: 600;
      }
      .feed {
        flex: 1;
        overflow: auto;
        padding: 28px 40px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 820px;
      }
      .msg {
        max-width: 640px;
        padding: 12px 16px;
        border-radius: 14px;
      }
      .bot {
        background: #f4f5f8;
        align-self: flex-start;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid #d5d8e2;
        border-radius: 10px;
        background: #fff;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .chip i {
        width: 22px;
        height: 26px;
        border-radius: 4px;
        background: #3b6fe0;
        display: inline-block;
      }
      .composer {
        margin: 0 40px 24px;
        max-width: 780px;
        border: 1px solid #d5d8e2;
        border-radius: 16px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 2px 10px rgba(20, 30, 60, 0.06);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .composer textarea {
        flex: 1;
        border: 0;
        resize: none;
        font: inherit;
        outline: none;
        height: 26px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid #d5d8e2;
        background: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .send {
        background: #1f2430;
        border-color: #1f2430;
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="new" data-i18n="new">+ Новый чат</div>
      <div class="hist-h" data-i18n="recent">Недавние</div>
      <div class="hist on" data-i18n="h1">Разбор договора поставки</div>
      <div class="hist" data-i18n="h2">Сверка реестра контрагентов</div>
      <div class="hist" data-i18n="h3">Тезисы для презентации</div>
      <div class="hist" data-i18n="h4">Письмо партнёру</div>
    </aside>
    <main>
      <header data-i18n="title">Ассистент</header>
      <div class="feed" id="feed">
        <div class="msg bot" data-i18n="hello">Здравствуйте! Прикрепите документ — помогу разобрать условия, найти риски и подготовить ответ.</div>
      </div>
      <div class="composer">
        <div id="attachments"></div>
        <div class="row">
          <button class="icon-btn" id="attach" type="button" aria-label="attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#39404f" stroke-width="2" stroke-linecap="round">
              <path d="M21 11.5l-8.6 8.6a5 5 0 01-7-7l8.6-8.6a3.3 3.3 0 014.7 4.7l-8.6 8.6a1.7 1.7 0 01-2.4-2.4l8-8" />
            </svg>
          </button>
          <input id="file" type="file" hidden />
          <textarea data-i18n-ph="ph" placeholder="Напишите сообщение…"></textarea>
          <button class="icon-btn send" type="button" aria-label="send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script>
      const EN = {
        new: '+ New chat',
        recent: 'Recent',
        h1: 'Supply contract review',
        h2: 'Counterparty register check',
        h3: 'Talking points for a deck',
        h4: 'Letter to a partner',
        title: 'Assistant',
        hello: 'Hi! Attach a document and I will help you review the terms, spot risks and draft a reply.',
        ph: 'Write a message…',
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru';
      document.documentElement.lang = lang;
      if (lang === 'en') {
        for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = EN[el.dataset.i18n];
        for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = EN[el.dataset.i18nPh];
        document.title = EN.title;
      }
      window.__files = [];
      const input = document.getElementById('file');
      document.getElementById('attach').addEventListener('click', () => input.click());
      input.addEventListener('change', async () => {
        for (const f of input.files) {
          const buf = new Uint8Array(await f.arrayBuffer());
          let bin = '';
          for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
          window.__files.push({ name: f.name, b64: btoa(bin) });
          const chip = document.createElement('div');
          chip.className = 'chip';
          chip.innerHTML = '<i></i>';
          chip.append(`${f.name} · ${Math.max(1, Math.round(f.size / 1024))} KB`);
          document.getElementById('attachments').append(chip);
        }
      });
    </script>
  </body>
</html>

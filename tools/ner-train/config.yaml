# Configuration of the NER model for DOCX Anonymizer.
# Any key can be overridden from the command line: --set train.epochs=10 --set run_id=exp1
id: rubert-tiny2-ner-ruen          # model pack id
run_id: rubert-tiny2-ner-ruen      # artifacts go to runs/<run_id>/
version: 1.2.0
base_model: cointegrated/rubert-tiny2
seed: 42
labels: [O, B-PER, I-PER, B-ORG, I-ORG, B-LOC, I-LOC]

data:
  max_length: 128
  # sources: corpus mix of the training split. weight = how many times the train split is repeated
  # (a fractional part subsamples, e.g. 1.5 = once + a random half; 0 = source off). Licenses: README «Источники 1.2.0».
  # dedupe: true — train sentences equal to a test sentence (WikiANN test, test_factru, overlap_fixtures) are removed.
  # mode: sources        — every source below;
  #       teacher_synth  — fallback when external corpora are rejected: only kind=wikiann sources are kept and the
  #                        synthetic share is raised to >= synth.teacher_synth_min_share (teacher soft labels on it).
  mode: sources
  sources:
    - id: wikiann-ru
      kind: wikiann
      dataset: unimelb-nlp/wikiann
      config: ru
      lang: ru
      weight: 1
      license: "WikiANN annotations (Pan et al. 2017; Rahimi et al. 2019); text from Wikipedia, CC BY-SA 3.0"
      url: https://huggingface.co/datasets/unimelb-nlp/wikiann
      citation: "Pan et al., Cross-lingual Name Tagging and Linking for 282 Languages, ACL 2017; Rahimi et al., Massively Multilingual Transfer for NER, ACL 2019"
    - id: wikiann-en
      kind: wikiann
      dataset: unimelb-nlp/wikiann
      config: en
      lang: en
      weight: 1
      license: "WikiANN annotations (Pan et al. 2017; Rahimi et al. 2019); text from Wikipedia, CC BY-SA 3.0"
      url: https://huggingface.co/datasets/unimelb-nlp/wikiann
      citation: "Pan et al., Cross-lingual Name Tagging and Linking for 282 Languages, ACL 2017; Rahimi et al., Massively Multilingual Transfer for NER, ACL 2019"
    - id: factrueval-2016
      kind: factru
      lang: ru
      weight: 2
      commit: dfe96237fce79fde13b2021d1938587e4ea3042e
      sha256: 300469ac74e5bd1a46b45464c0508fe968db3f964169fc3bebcc53ce9b715ea7
      holdout_docs: 0.2      # share of documents held out as test_factru (informational metric)
      license: "MIT (annotations, dialogue-evaluation 2015); texts from OpenCorpora, CC BY-SA 3.0"
      url: https://github.com/dialogue-evaluation/factRuEval-2016
      citation: "Starostin et al., FactRuEval 2016: Evaluation of Named Entity Recognition and Fact Extraction Systems for Russian, Dialogue 2016"
    # 1.2.0 (owner decision 26.10.2026): corpora WITHOUT an explicit license on the texts — NOTICE, README and the help
    # page say so and that the model is used at the user's own risk
    - id: nerel-1.1
      kind: nerel
      lang: ru
      weight: 0.5             # half of the train split (abl. WP12-E: x1 costs WikiANN ru ORG -0.01 on validation)
      dedupe: true
      no_license: true        # NOTICE / README / help: corpus without an explicit license, model at the user's own risk
      commit: 8f07d3e410f322d5dbf6b68b13fbf4a4aa077fe9
      sha256: ffd4691e04a8df2a4cabddd361a168da41dffd281b9810709fb20e7b0513b7cc
      version_dir: NEREL-v1.1
      license: "NO EXPLICIT LICENSE (repository has no license file; texts from Russian Wikinews); used at the owner's decision, model used at the user's own risk"
      url: https://github.com/nerel-ds/NEREL
      citation: "Loukachevitch et al., NEREL: A Russian Dataset with Nested Named Entities, Relations and Events, RANLP 2021"
    - id: nerus-lenta
      kind: nerus
      lang: ru
      weight: 1
      dedupe: true
      no_license: true
      sentences: 20000        # random sentences of the document sample (pool ≈ 48.6k sentences, 4 417 documents)
      doc_share: 0.006        # deterministic document sample of the 739k-document dump (hash of seed:doc id)
      seed: 13
      file: nerus_lenta.conllu.gz
      download: https://storage.yandexcloud.net/natasha-nerus/data/nerus_lenta.conllu.gz
      sha256: fefd13f9af2efaa641580713e84c2f52fec646a7cdf7833a268a3adc70591d94
      license: "NO EXPLICIT LICENSE on the texts (Lenta.ru news; MIT covers the natasha/nerus code only); silver annotation by Slovnet BERT NER; used at the owner's decision, model used at the user's own risk"
      url: https://github.com/natasha/nerus
      citation: "Nerus — large silver standard Russian corpus with NER, morphology and syntax markup (natasha project, A. Kukushkin)"
  # evaluation fixtures checked for overlap with the dedupe sources (paths from the repository root)
  overlap_fixtures:
    - "tests/fixtures/genres/**/*.gold.json"
    - "tests/fixtures/heldout/**/*.gold.json"
    - "tests/fixtures/ner/backlog-0.4.json"
    - "tests/fixtures/ner/heldout-names.json"
  synth:
    enabled: true
    share: 0.42          # share of synthetic sentences in the final train split (1.1.0: 0.35; 1.2.0 adds six genres
                         # and NEREL / Nerus — the 1.1.0 genres keep about their absolute volume)
    max_ratio: 0.5       # upper bound for share (was a hard 20 % assert in 1.0.0)
    teacher_synth_min_share: 0.5   # share used in data.mode=teacher_synth
    genre_share: 0.8     # genre templates among synthetic sentences (the rest: contract templates of 1.0.0)
    negative_share: 0.45 # entity-free sentences among genre sentences
    min_negative_share: 0.3        # assert: entity-free share of all synthetic sentences
    seed: 7
    test_seed: 20261019  # synth_genre_test: held-out word lists, no sentence equal to a training one
    test_size: 2000
    # genre corpus gold (WP11-B, path from the repository root): word-list items sharing a proper-name word with its
    # PERSON / COMPANY values are dropped, so eval-genres stays a held-out measurement (data_info.json gold_exclusion)
    # 1.2.0: also the held-out fixtures (WP11-D) and the K11 backlog cases (heldout2 / heldout3 names)
    exclude_gold:
      - "tests/fixtures/genres/**/*.gold.json"
      - "tests/fixtures/heldout/**/*.gold.json"
      - "tests/fixtures/ner/backlog-0.4.json"
      - "tests/fixtures/ner/heldout-names.json"

train:
  learning_rate: 2.0e-4   # 5e-5 (spec default) gave ORG 0.708; see README
  batch_size: 32
  epochs: 15
  warmup_ratio: 0.1
  weight_decay: 0.01
  label_smoothing: 0.0
  fp16: true            # used only when CUDA is available
  num_workers: 2

export:
  opset: 17

quantize:
  max_size_mb: 40
  # MatMul nodes left fp32 by name suffix, e.g. [classifier/MatMul, layer.2/output/dense/MatMul,
  # layer.2/intermediate/dense/MatMul] (the first 1.2.0 build: +1 MB, NER on 20 pages +15 %). Since the review of
  # WP12-E (owner, 27.10.2026) everything is int8, as in 1.1.0; the agreement gate is on 2 000 sentences (README 1.2.0)
  keep_fp32: []

verify:
  sentences: 50            # informational since 1.2.0 (670 tokens: one token = 0.15 pp)
  gate_sentences: 2000     # 1 000 ru + 1 000 en test sentences — the argmax agreement gate
  min_agreement: 0.99
  baseline_onnx: ../../../ner-models-backup/rubert-tiny2-ner-ruen-1.1.0/model.onnx   # published 1.1.0 int8 (K10 on int8)

calibrate:
  score: marginal     # marginal = P(B-X)+P(I-X) averaged over words (JS provider); argmax = P(predicted label)
  grid_start: 0.30
  grid_stop: 0.95
  grid_step: 0.05

evaluate:
  threshold: 0.7                # nerThreshold of the extension (heldout_names decoding)
  # K10: hand-written held-out sentences (foreign names, names without context, initials, tables) + the K11 backlog
  heldout_names:
    - tests/fixtures/ner/heldout-names.json
    - tests/fixtures/ner/backlog-0.4.json
  baseline_model: runs/rubert-tiny2-ner-ruen-1.1.0/model   # the published 1.1.0 (PyTorch fp32 of the same run)

gates:                          # concept 0.5, K10; evaluate.py --strict exits 1 when a gate fails
  ru_per_f1: 0.91
  ru_org_f1: 0.75               # "no regression to 1.1.0"; 0.78 is not reachable by rubert-tiny2 (README 1.1.0)
  synth_genre_org_precision: 0.85
  synth_genre_false_org_max: 5  # false ORG spans on the entity-free sentences of synth_genre_test (at most)
  heldout_names_recall_gain: 0.10  # PER recall on evaluate.heldout_names: this model minus the 1.1.0 baseline
  en_per_f1: 0.80               # informational

# Knowledge distillation (teacher.py, then train.py uses the teacher's soft labels)
distill:
  enabled: true
  teacher: FacebookAI/xlm-roberta-base   # MIT; used only to produce soft labels, not distributed
  teacher_license: MIT
  teacher_lr: 3.0e-5
  teacher_epochs: 3
  teacher_batch: 32
  temperature: 2.0
  alpha: 0.3          # weight of the hard-label cross-entropy; (1 - alpha) for the KL term
